<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Online Exam - Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Online Online Exam</h2>
    <a class="btn btn-outline-secondary btn-sm" href="/admin">Admin</a>
  </div>
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label class="form-label">Course</label>
          <select id="course" class="form-select">
            {% for c in courses %}<option>{{ c }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6" id="studentInputGroup" style="display:none">
          <label class="form-label">Student number</label>
          <input id="studentNumber" class="form-control" placeholder="Enter student number and press Enter">
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap mt-3">
        <button class="btn btn-primary" data-action="In Test Students today">In Test Students today</button>
        <button class="btn btn-primary" data-action="Completed Students today">Completed Students today</button>
        <button class="btn btn-primary" data-action="Completed Students this year">Completed Students this year</button>
        <button class="btn btn-outline-primary" id="studentInfoBtn" data-action="Student information">Student information</button>
      </div>
    </div>
  </div>

  <div id="results" class="mt-4"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
